name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH to confirm publication of both scoped packages
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Verify npm version
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) exit 1 }'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build all packages
        run: npm run build

      - name: Publish core package using npm trusted publishing
        run: npm publish --workspace @cursorbuild/core --access public

      - name: Publish React package using npm trusted publishing
        run: npm publish --workspace @cursorbuild/react --access public
